name: Build the CLI for a release

# Every release gets a dobase binary per platform, which cli/install.sh downloads.
# Pull requests that touch the CLI build them too, without uploading anything.
on:
  pull_request:
    paths: [ "cli/**", ".github/workflows/cli-release.yml" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for, e.g. 2026.09.24"
        required: true

permissions:
  contents: write # upload release assets

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cli
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || 'pr-build' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # Go cross-compiles every platform from one runner. The archive names keep
      # the targets of the first (Rust) builds, which install.sh and older
      # installs download.
      - name: Build and package
        run: |
          mkdir -p dist
          while read -r target goos goarch; do
            out="build/$target"
            binary=dobase
            [ "$goos" = windows ] && binary=dobase.exe
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/smgdkngt/dobase/cli/internal/cli.Version=$TAG" -o "$out/$binary" .
            if [ "$goos" = windows ]; then
              archive=dobase-$target.zip
              (cd "$out" && zip -q "../../dist/$archive" "$binary")
            else
              archive=dobase-$target.tar.gz
              tar -czf "dist/$archive" -C "$out" "$binary"
            fi
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          done <<'TARGETS'
          aarch64-apple-darwin darwin arm64
          x86_64-apple-darwin darwin amd64
          x86_64-unknown-linux-musl linux amd64
          aarch64-unknown-linux-musl linux arm64
          x86_64-pc-windows-msvc windows amd64
          TARGETS

      - name: Smoke test
        run: build/x86_64-unknown-linux-musl/dobase --version | grep -F "$TAG"

      - name: Upload to the release
        if: github.event_name != 'pull_request'
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
