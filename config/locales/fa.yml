    format:
      delimiter: "٬"
      separator: "٫"
      precision: 3
      significant: false
      strip_insignificant_zeros: false
    human:
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: "بایت"
            other: "بایت"
          kb: "کیلوبایت"
          mb: "مگابایت"
          gb: "گیگابایت"
          tb: "ترابایت"
          pb: "پتابایت"
          eb: "اگزابایت"
    percentage:
      format:
        format: "%n٪"
  helpers:
    select:
      prompt: "لطفاً انتخاب کنید"
    submit:
      create: "ساخت %{model}"
      submit: "ذخیرهٔ %{model}"
      update: "به‌روزرسانی %{model}"
  support:
    array:
      words_connector: "، "
      two_words_connector: " و "
      last_word_connector: " و "
